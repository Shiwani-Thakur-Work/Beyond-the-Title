<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow circles -->
  <circle cx="200" cy="180" r="300" fill="#4F46E5" opacity="0.18" filter="blur(80px)"/>
  <circle cx="1050" cy="450" r="280" fill="#7C3AED" opacity="0.16" filter="blur(80px)"/>

  <!-- Logo Mark -->
  <g transform="translate(100, 140)">
    <rect width="140" height="140" rx="36" fill="url(#brand)"/>
    <circle cx="70" cy="70" r="44" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 4" opacity="0.5"/>
    <polygon points="70,26 84,70 70,62 56,70" fill="#FDE047"/>
    <polygon points="70,114 84,70 70,78 56,70" fill="#FFFFFF"/>
    <circle cx="70" cy="70" r="8" fill="#312E81"/>
    <circle cx="70" cy="70" r="4" fill="#FDE047"/>
  </g>

  <!-- Category Tag -->
  <g transform="translate(270, 160)">
    <rect width="320" height="36" rx="18" fill="#312E81" stroke="#6366F1" stroke-width="1.5" opacity="0.8"/>
    <text x="160" y="23" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#A5B4FC" text-anchor="middle" letter-spacing="1.5">MULTIDIRECTIONAL TALENT DISCOVERY</text>
  </g>

  <!-- Title -->
  <text x="270" y="245" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#text-grad)" letter-spacing="-1">
    Beyond the Title
  </text>

  <!-- Subtitle -->
  <text x="100" y="360" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94A3B8">
    Discover opportunities based on primary roles, transferable capabilities,
  </text>
  <text x="100" y="398" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94A3B8">
    and verified project evidence — beyond rigid, single job titles.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 480)">
    <rect width="210" height="44" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="105" y="27" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#34D399" text-anchor="middle">✓ Evidence-Graded Skills</text>
  </g>

  <g transform="translate(330, 480)">
    <rect width="220" height="44" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="110" y="27" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#60A5FA" text-anchor="middle">✓ Explainable Matching</text>
  </g>

  <g transform="translate(570, 480)">
    <rect width="240" height="44" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="120" y="27" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#F472B6" text-anchor="middle">✓ Honest Gap Transparency</text>
  </g>

  <g transform="translate(830, 480)">
    <rect width="230" height="44" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="115" y="27" font-family="-apple-system, system-ui, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#FBBF24" text-anchor="middle">✓ 100% Client-Side Privacy</text>
  </g>
</svg>
