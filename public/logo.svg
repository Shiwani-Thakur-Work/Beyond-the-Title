<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4F46E5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#brand-grad)" filter="url(#shadow)"/>

  <!-- Compass dial ring -->
  <circle cx="256" cy="256" r="140" stroke="#FFFFFF" stroke-width="8" stroke-dasharray="12 12" opacity="0.45"/>
  <circle cx="256" cy="256" r="165" stroke="#FFFFFF" stroke-width="3" opacity="0.25"/>

  <!-- North Needle (Amber/Yellow) -->
  <polygon points="256,100 300,256 256,230 212,256" fill="#FDE047"/>

  <!-- South Needle (Pure White) -->
  <polygon points="256,412 300,256 256,282 212,256" fill="#FFFFFF"/>

  <!-- Center Pivot Pin -->
  <circle cx="256" cy="256" r="26" fill="#312E81"/>
  <circle cx="256" cy="256" r="12" fill="#FDE047"/>
</svg>
